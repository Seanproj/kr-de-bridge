name: CI
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: 데이터 스키마 검사
        run: npm run check:data
      - name: 빌드 (Astro + Pagefind)
        run: npm run build
